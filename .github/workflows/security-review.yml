
name: CI/CD Security Review

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  security-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Check for accidental secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
